org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# The only SDK platform installed on this machine is android-37.0, which is newer
# than AGP 8.7.3 officially knows about. The platform jar is present and valid, so
# we compile against it and silence the "untested compile SDK" warning.
android.suppressUnsupportedCompileSdk=37
